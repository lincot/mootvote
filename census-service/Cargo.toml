[package]
name = "census-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
ark-bn254 = "0.5"
babyjubjub-rs = "0.0.11"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
ff_ce = "0.11"
hex = "0.4"
light-poseidon = "0.4"
num-bigint = "0.4"
rand = "0.9"
ruint = "1.17.0"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }
tracing = "0.1"
tracing-subscriber = "0.3"
