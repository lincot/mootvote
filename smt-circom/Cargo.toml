[package]
authors = ["lincot <lincot@disroot.org>"]
categories = ["data-structures"]
description = "Sparse Merkle Tree, compatible with circom proofs"
edition = "2021"
keywords = ["zk", "fast"]
license = "MIT OR Apache-2.0"
name = "smt-circom"
readme = "README.md"
repository = "https://github.com/lincot/mootvote"
version = "0.1.0"

[dependencies]
ark-bn254 = "0.5"
heapless = "0.9"
light-poseidon = "0.4"
rocksdb = { version = "0.24", default-features = false, optional = true }
thiserror = "2"

[dev-dependencies]
rand_core = "0.9"
rand_pcg = "0.9"

[features]
default = ["rocksdb"]
