[package]
name = "mootvote-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
anchor-lang = "1.0"
mootvote = { path = "../programs/mootvote", features = ["no-entrypoint"] }
base64 = "0.21"
bincode = "1.3"
bytemuck = { version = "1.21", features = ["extern_crate_alloc"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.11", features = ["stream"] }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.15", features = ["hex"] }
solana-client = "3"
solana-sdk = "3"
solana-transaction-status = "3"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.solana-tools]
git = "https://github.com/lincot/solana-tools"
branch = "new-dev"
