http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    listen [::]:80;

    location / {
      proxy_pass http://localhost:5173;
      proxy_set_header Host $host;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location /api/indexer/ { proxy_pass http://127.0.0.1:8080/; }
    location /api/census/  { proxy_pass http://127.0.0.1:8081/; }
    location /api/relayer/ { proxy_pass http://127.0.0.1:8082/; }
  }
}
