http {
  include       mime.types;
  default_type  application/octet-stream;

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;

    ssl_protocols TLSv1.3;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    quic_gso on;
    quic_retry on;
    quic_host_key /etc/nginx/quic_host_key;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/mootvote/current;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/indexer/ { proxy_pass http://127.0.0.1:8080/; }
    location /api/census/ { proxy_pass http://127.0.0.1:8081/; }
    location /api/relayer/ { proxy_pass http://127.0.0.1:8082/; }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }
  }
}
