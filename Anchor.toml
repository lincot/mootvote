[toolchain]
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
mootvote = "MootuH214qRLx112xw76ybo1VxwZsQAR539m3Bou6GY"
zk_relayer = "Re1ayvvPwJq5NME13UGtyt7X7nC9Zr8PfQdQthquks9"

[programs.devnet]
mootvote = "MootuH214qRLx112xw76ybo1VxwZsQAR539m3Bou6GY"
zk_relayer = "Re1ayvvPwJq5NME13UGtyt7X7nC9Zr8PfQdQthquks9"

[test.validator]
url = "https://api.devnet.solana.com"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = """
cp target/idl/zk_relayer.json target/types/zk_relayer.ts ts-sdk-relayer/src/idl/ && \
pnpm build:sdk-relayer && \
cp target/idl/mootvote.json target/types/mootvote.ts ts-sdk/src/idl/ && \
pnpm build:sdk && \
pnpm ts-mocha -p ./tsconfig.json --no-timeouts --slow 0 --exit tests/*.test.ts
"""

fetch-relayer-config = "pnpm ts-node scripts/zk-relayer/fetchConfig.ts"
initialize-mootvote = "pnpm ts-node scripts/mootvote/initialize.ts"
initialize-relayer = "pnpm ts-node scripts/zk-relayer/initialize.ts"
update-relayer-config = "pnpm ts-node scripts/zk-relayer/updateConfig.ts"
