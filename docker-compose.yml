services:
  pg:
    image: postgres:18
    environment:
      POSTGRES_USER: mootvote
      POSTGRES_PASSWORD: mootvote
      POSTGRES_DB: mootvote
    ports: ["5432:5432"]
    volumes:
      - pgroot:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mootvote -d mootvote"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  pgroot:
